apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.livekit.reactnative"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    maven {
        url 'https://jitpack.io'
        content { includeModule 'com.github.davidliu', 'audioswitch' }
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'com.github.davidliu:audioswitch:89582c47c9a04c62f90aa5e57251af4800a62c9a'
    api project(':dtelecom_react-native-webrtc')
}
