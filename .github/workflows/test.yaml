name: SDK checks
on:
  push:
    branches: [main, dtelecom-m150]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn typescript
      - run: yarn lint
      - run: yarn test --runInBand
      - run: yarn prepare
