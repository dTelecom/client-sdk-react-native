name: Example native builds
on:
  push:
    branches: [main, dtelecom-m150]
  pull_request:

jobs:
  example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - working-directory: example
        run: npm install --no-save "$RUNNER_TEMP"/dtelecom-react-native-*.tgz
      - working-directory: example
        run: npm test && npm run typecheck
      - if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: runner.os == 'Linux'
        working-directory: example/android
        run: ./gradlew :app:assembleDebug
      - if: runner.os == 'macOS'
        working-directory: example/ios
        run: |
          pod install
          xcodebuild -workspace DtelecomRooms.xcworkspace -scheme DtelecomRooms -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
