name: Example native builds
on:
  push:
    branches: [main, dtelecom-m150]
  pull_request:

jobs:
  example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - working-directory: example
        run: npm install --no-save "$RUNNER_TEMP"/dtelecom-react-native-*.tgz
      - working-directory: example
        run: npm test && npm run typecheck
      - if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: runner.os == 'Linux'
        working-directory: example/android
        run: |
          ./gradlew :app:assembleDebug
          ./gradlew -I ../../ci/capture-processing/android.gradle \
            -PcaptureTestSources="$GITHUB_WORKSPACE/ci/capture-processing/android" \
            :dtelecom_react-native:testDebugUnitTest --tests org.dtelecom.ci.CaptureProcessingTest
      - if: runner.os == 'macOS'
        working-directory: example/ios
        run: |
          pod install
          xcodebuild -workspace DtelecomRooms.xcworkspace -scheme DtelecomRooms -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Check public Apple capture processor lifecycle
        if: runner.os == 'macOS'
        run: bash ci/capture-processing/check-apple.sh example
      - name: Check iOS native call actions before React Native starts
        if: runner.os == 'macOS'
        run: bash ci/system-calls/check-apple.sh example
      - name: Check installed bridge audio-session ownership and retries
        if: runner.os == 'macOS'
        run: bash example/node_modules/@dtelecom/react-native-webrtc/tools/check-audio-session-observer.sh example
      - name: Check native encrypted video and recovery with a corrected key
        if: runner.os == 'macOS'
        run: bash ci/encrypted-media/check-ios.sh example
